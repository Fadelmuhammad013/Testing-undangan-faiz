
name: Deploy Wedding Invitation

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate guest pages
        run: |
          python - <<'PY'
          import json
          import shutil
          from pathlib import Path

          source = Path("undangan-bugis-responsive")
          output = Path("dist")

          if not (source / "index.html").exists():
              raise FileNotFoundError("index.html tidak ditemukan di folder undangan-bugis-responsive")

          guest_file = source / "tamu.json"
          if not guest_file.exists():
              raise FileNotFoundError("tamu.json belum dibuat di folder undangan-bugis-responsive")

          guests = json.loads(guest_file.read_text(encoding="utf-8"))
          output.mkdir(exist_ok=True)

          # Salin website utama
          for item in source.iterdir():
              if item.name == "tamu.json":
                  continue

              target = output / item.name
              if item.is_dir():
                  shutil.copytree(item, target, dirs_exist_ok=True)
              else:
                  shutil.copy2(item, target)

          # Buat halaman personal setiap tamu
          used_slugs = set()

          for guest in guests:
              slug = guest["slug"].strip().lower()
              name = guest["nama"].strip()

              if not slug or any(c not in "abcdefghijklmnopqrstuvwxyz0123456789-" for c in slug):
                  raise ValueError(f"Slug tidak valid: {slug}")

              if slug in used_slugs:
                  raise ValueError(f"Slug duplikat: {slug}")

              used_slugs.add(slug)
              folder = output / slug
              folder.mkdir(parents=True, exist_ok=True)

              html = (source / "index.html").read_text(encoding="utf-8")

              replacements = [
                  ('href="style.css"', 'href="../style.css"'),
                  ("href='style.css'", "href='../style.css'"),
                  ('src="script.js"', 'src="../script.js"'),
                  ("src='script.js'", "src='../script.js'"),
                  ('src="assets/', 'src="../assets/'),
                  ("src='assets/", "src='../assets/"),
                  ('href="assets/', 'href="../assets/'),
                  ("href='assets/", "href='../assets/'),
              ]

              for old, new in replacements:
                  html = html.replace(old, new)

              (folder / "index.html").write_text(html, encoding="utf-8")

              print(f"Halaman dibuat: /{slug}/ untuk {name}")

          print("Selesai membuat halaman personal.")

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
