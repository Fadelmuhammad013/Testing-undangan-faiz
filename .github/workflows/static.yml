
name: Deploy Wedding Invitation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Check Python
        run: python --version

      - name: Generate guest pages
        run: python build.py

      - name: Verify generated pages
        run: |
          test -f dist/index.html
          test -f dist/fifi/index.html
          test -f dist/faidah/index.html
          grep -q 'Fifi' dist/fifi/index.html
          grep -q 'Faidah' dist/faidah/index.html
          echo "Semua halaman testing berhasil dibuat."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
